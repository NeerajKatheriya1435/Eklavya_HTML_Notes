<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        .container {
            display: grid;
            grid-template-columns: auto auto;
            /* border: 2px solid green; */
            align-items: center;
            /* height: 5vh; */
            padding: 5px;
            background-color: rgb(164, 169, 231);
        }

        .logo {
            /* border: 2px solid gray; */
            font-size: 32px;
            font-weight: 900;
            color: rgb(151, 10, 113);
        }

        .navbar {
            /* border: 2px solid red; */
        }

        .navbar ul {
            display: flex;
            list-style: none;
            align-items: center;
        }

        ul li {
            margin-left: 32px;
        }

        ul li a {
            font-size: 25px;
            /* text-decoration: none; */
            color: rgb(8, 97, 29);
        }
    </style>
</head>

<body>

    <section class="container">
        <div class="logo">
            TechVision Technologies
        </div>
        <nav class="navbar">
            <ul>
                <li><a href="">Home</a> </li>
                <li><a href="">About</a> </li>
                <li><a href="">Services</a> </li>
                <li><a href="">Contact</a> </li>
                <li><a href="">Feedback</a> </li>
            </ul>
        </nav>
    </section>
</body>

</html>
