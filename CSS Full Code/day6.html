<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 600px;
        }

        .box {
            height: 100px;
            width: 100px;
            color: aqua;
            background-color: rgb(79, 217, 63);
            border-radius: 16px;
            text-align: center;
            padding-top: 33px;
            transition: all 2s ease-in-out;
        }

        .box:hover {
            background-color: rgb(87, 135, 218);
            border-radius: 50px;
            color: rgb(233, 233, 233);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            Eklavya
        </div>
    </div>
</body>

</html>
