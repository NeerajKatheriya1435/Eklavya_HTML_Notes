<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Students Details</h1>
    <form action="">
        Name: <input type="text" placeholder="Enter your Name"> <br> <br>
        Email: <input type="email" placeholder="Enter your Email"><br> <br>
        Password: <input type="password"><br> <br>
        Phone No: <input type="number"><br> <br>
        Gender: <input type="radio" name="gender">Male<input type="radio" name="gender">Female<br> <br>
        Are You Married: <input type="checkbox" name="" id=""><br><br>
        Caste: <select name="" id="">
            <!-- <option value="">Select</option> -->
            <option value="">UpperCast</option>
            <option value="">MiddleCast</option>
            <option value="">LowerCast</option>
        </select>
        <br><br>
        Things:
        <select name="" id="">
            <optgroup label="Fruits">
                <option value="">Mango</option>
                <option value="">Apple</option>
                <option value="" selected>Guawa</option>
            </optgroup>
            <optgroup label="Phone">
                <option value="">Samsung</option>
                <option value="">Apple</option>
                <option value="">Realme</option>
            </optgroup>
            <optgroup label="Vegetables">
                <option value="">Brockely</option>
                <option value="">Tomatao</option>
                <option value="">Potato</option>
            </optgroup>
        </select>
        <br><br>
        Upload Your Image: <input type="file" name="" id=""> <br><br>
        Message: <textarea placeholder="Write Your Comment..." rows="12" cols="36" name="" id=""></textarea>
        <br><br>
        <input type="reset" name="" id="">
        <input type="submit" name="" id="">
        <button>Normal Button</button>
    </form>
</body>

</html>
